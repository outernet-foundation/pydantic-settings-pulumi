name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-release-devkit
      - name: lint-ci
        run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev lint-ci
      - run: uv run preflight-python
      - name: publish-stable dry-run
        run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev publish-stable --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REGISTRY_USERNAME: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ github.token }}
