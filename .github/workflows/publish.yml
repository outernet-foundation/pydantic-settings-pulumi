name: Publish

on:
  push:
    branches: [main, dev]

concurrency:
  group: publish-${{ github.ref }}

permissions:
  contents: read

jobs:
  ensure-release-pr:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with: &consumer-ledger
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - &checkout-release-devkit
        uses: ./.github/actions/checkout-release-devkit
      - uses: ./.release-devkit/.github/actions/ensure-release-pr

  publish-prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: *consumer-ledger
      - *checkout-release-devkit
      - uses: ./.release-devkit/.github/actions/publish-prerelease

  publish-stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - *checkout-release-devkit
      - uses: ./.release-devkit/.github/actions/publish-stable
