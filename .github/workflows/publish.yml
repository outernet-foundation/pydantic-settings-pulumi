name: Publish

on:
  push:
    branches: [main, dev]

concurrency:
  group: publish-${{ github.ref }}

permissions:
  contents: read

jobs:
  ensure-release-pr:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with: &consumer-ledger
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - &setup-release-devkit
        uses: ./.github/actions/setup-release-devkit
      - name: ensure-release-pr
        run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev ensure-release-pr
        env:
          GH_TOKEN: ${{ github.token }}

  publish-prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: *consumer-ledger
      - *setup-release-devkit
      - name: publish-prerelease
        run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev publish-prerelease

  publish-stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - *setup-release-devkit
      - name: publish-stable
        run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev publish-stable
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REGISTRY_USERNAME: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ github.token }}
